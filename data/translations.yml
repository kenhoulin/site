# translations.yml — translated editions, keyed by BibTeX citation key in
# publications/publications.bib. Rendered by cv.qmd as sub-items under the
# book entry.
#
# Titles and publishers are recorded in Latin script only. The CV is set in
# Charter and compiled with xelatex, and pulling CJK faces into that run was
# fragile; the original-script titles live on the homepage instead (see the
# book-editions list in index.qmd), where web fonts handle them.
lin2020divested:
  - language: Traditional Chinese
    year: 2021
    city: Taipei
    publisher: Springhill Publishing
  - language: Simplified Chinese
    year: 2024
    city: Beijing
    publisher: China Renmin University Press
  - language: Russian
    year: forthcoming
    city: Boston
    publisher: Academic Studies Press
