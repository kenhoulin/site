project:
  type: website
  pre-render: _quarto-pre-render.R
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - publications/network.json
    - publications/publications.json
    - publications/network.js
    - publications/filter.js
    - cv.pdf
    - assets/
    - CNAME

website:
  title: "Ken-Hou Lin"
  favicon: assets/favicon.png
  navbar:
    pinned: true
    background: light
    left:
      - href: index.qmd
        text: About
      - text: Research
        href: index.qmd#research
      - text: Contact
        href: index.qmd#contact
      - text: CV
        href: cv.pdf
        target: _blank
    right:
      - text: Google Scholar
        href: "https://scholar.google.com/citations?user=4rlcdG0AAAAJ&hl=en"
        target: _blank
  page-footer:
    center: "Ken-Hou Lin · University of Texas at Austin"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
