project:
  type: website
  pre-render: _quarto-pre-render.R
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - publications/network.json
    - publications/publications.json
    - publications/network.js
    - publications/filter.js
    - theme.js
    - KHL_CV.pdf
    - assets/
    - CNAME

website:
  title: "Ken-Hou Lin"
  favicon: assets/favicon.png
  navbar:
    pinned: true
    background: light
    # All items sit left so they read in this order; the right slot holds only
    # Quarto's own theme toggle and search.
    left:
      - text: Research
        href: index.qmd#research
      - text: Books
        href: index.qmd#books
      - text: Bio
        href: index.qmd#bio
      - text: CV
        href: KHL_CV.pdf
        target: _blank
      - text: Google Scholar
        href: "https://scholar.google.com/citations?user=4rlcdG0AAAAJ&hl=en"
        target: _blank
      - text: Contact
        href: index.qmd#contact
  page-footer:
    center: "Ken-Hou Lin"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false   # no hover link-icons on headings (one-page site)
